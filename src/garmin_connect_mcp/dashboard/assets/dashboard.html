<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pulso</title>
<link rel="icon" href="/*__ICON__*/">
<style>/*__STYLES__*/</style>
</head>
<body>
<div id="sync-bar" class="sync-bar" hidden><i></i></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <img src="/*__ICON__*/" alt="" aria-hidden="true">
      <div>
        <strong>Pulso</strong>
        <span id="sync-info"></span>
      </div>
    </div>
    <div class="controls">
      <div id="sync-pill" class="sync-pill" hidden role="status" aria-live="polite"><span class="led"></span><span id="sync-text"></span></div>
      <button id="sync-btn" class="btn primary" hidden></button>
      <button id="lang-btn" class="btn icon" title="Idioma / Language">EN</button>
      <button id="theme-btn" class="btn icon" title="Tema" aria-label="Tema">◐</button>
    </div>
  </div>
  <div class="topbar-inner nav-row">
    <nav id="tabs" class="tabs" aria-label="Secciones"></nav>
    <div class="period">
      <label for="scope" data-i18n="period"></label>
      <select id="scope" class="select"></select>
    </div>
  </div>
</header>

<div id="banner" class="banner" hidden role="alert"></div>

<div id="welcome" class="welcome" hidden>
  <div class="welcome-card">
    <img class="welcome-logo" src="/*__ICON__*/" alt="" aria-hidden="true">
    <h1 data-i18n="welcomeTitle"></h1>
    <p class="muted" data-i18n="welcomeBody"></p>
    <div class="progress"><i id="welcome-bar"></i></div>
    <div class="welcome-meta"><span id="welcome-step"></span><span id="welcome-pct"></span></div>
    <ul id="welcome-sources" class="welcome-sources"></ul>
  </div>
</div>

<main id="main">
  <!-- Resumen -->
  <section data-tab="overview">
    <p id="headline" class="headline"></p>
    <div id="kpis" class="tiles four"></div>

    <div class="card" id="now-card">
      <div class="card-head">
        <div>
          <h2 data-i18n="nowTitle"></h2>
          <p class="sub" id="now-sub"></p>
        </div>
      </div>
      <div id="now" class="now"></div>
    </div>

    <div class="card">
      <h2 data-i18n="weeklyTitle"></h2>
      <p class="sub" data-i18n="weeklySub"></p>
      <div class="legend" id="weekly-legend"></div>
      <div class="chart"><canvas id="c-weekly"></canvas></div>
    </div>

    <div class="section-head">
      <h2 data-i18n="findingsTitle"></h2>
      <p class="sub" data-i18n="findingsSub"></p>
    </div>
    <div id="findings" class="findings"></div>
  </section>

  <!-- Entrenamiento -->
  <section data-tab="training">
    <div class="card">
      <h2 data-i18n="bySportTitle"></h2>
      <p class="sub" data-i18n="bySportSub"></p>
      <div id="sport-table" class="table-wrap"></div>
    </div>

    <div class="card">
      <h2 data-i18n="monthlyTitle"></h2>
      <p class="sub" data-i18n="monthlySub"></p>
      <div class="legend" id="monthly-legend"></div>
      <div class="chart"><canvas id="c-monthly"></canvas></div>
    </div>

    <div class="grid two">
      <div class="card">
        <h2 data-i18n="formTitle"></h2>
        <p class="sub" data-i18n="formSub"></p>
        <div class="legend" id="form-legend"></div>
        <div class="chart"><canvas id="c-form"></canvas></div>
      </div>
      <div class="card">
        <h2 data-i18n="zonesTitle"></h2>
        <p class="sub" data-i18n="zonesSub"></p>
        <div id="zones" class="zones"></div>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="calendarTitle"></h2>
      <p class="sub" data-i18n="calendarSub"></p>
      <div id="calendar" class="calendar"></div>
    </div>

    <div class="card">
      <h2 data-i18n="recordsTitle"></h2>
      <div id="records" class="records"></div>
    </div>
  </section>

  <!-- Recuperación y sueño -->
  <section data-tab="health">
    <p class="lead" data-i18n="healthLead"></p>
    <div id="health-cards" class="metric-grid"></div>

    <div class="card">
      <h2 data-i18n="sleepTitle"></h2>
      <p class="sub" data-i18n="sleepSub"></p>
      <div id="sleep-tiles" class="tiles four compact"></div>
      <div class="legend" id="sleep-legend"></div>
      <div class="chart"><canvas id="c-sleep"></canvas></div>
    </div>

    <div id="body-cards" class="metric-grid two"></div>
  </section>

  <!-- Año a año -->
  <section data-tab="history">
    <div class="card">
      <div class="card-head">
        <div>
          <h2 data-i18n="cumTitle"></h2>
          <p class="sub" data-i18n="cumSub"></p>
        </div>
        <div id="cum-metric" class="segmented" role="tablist"></div>
      </div>
      <div class="legend" id="cum-legend"></div>
      <div class="chart tall"><canvas id="c-cumulative"></canvas></div>
    </div>

    <div class="card">
      <h2 data-i18n="yearTitle"></h2>
      <p class="sub" data-i18n="yearSub"></p>
      <div id="year-table" class="table-wrap"></div>
    </div>
  </section>

  <!-- Actividades -->
  <section data-tab="activities">
    <div class="card">
      <div class="toolbar">
        <input id="act-search" class="input" type="search">
        <select id="act-sport" class="select"></select>
        <span id="act-count" class="muted"></span>
      </div>
      <div id="act-table" class="table-wrap"></div>
      <div id="act-pager" class="pager"></div>
    </div>
  </section>
</main>

<footer class="footer">
  <span data-i18n="privacy"></span>
  <span id="errors"></span>
</footer>

<div id="toast" class="toast" hidden></div>

<script>/*__CHART_JS__*/</script>
<script>
window.GARMIN_DATA = /*__DATA__*/null;
window.GARMIN_LIVE = /*__LIVE__*/false;
window.GARMIN_AUTOSYNC = /*__AUTOSYNC__*/false;
</script>
<script>/*__APP_JS__*/</script>
</body>
</html>
